name: wireguard-external-service-scenario

services:
  wg-client:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg-client
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      APPLICATION_IP: ${APPLICATION_IP:?APPLICATION_IP must be set}
    volumes:
      - ./client/runtime/wg-confs:/config/wg_confs:ro
      - ./client/setup-iptables.sh:/config/setup-iptables.sh:ro
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      wg_n1:
        ipv4_address: 172.30.0.2
      wg_n2:
        ipv4_address: 172.31.0.2
    # Optional. Only needed when server runs on same host as client.
    # Then the Server_URL in the .env needs to be `host.docker.internal`
    # since that resolves to localhost of the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n1:
    container_name: n1
    hostname: n1
    cap_add:
      - NET_ADMIN
    privileged: 'true'
    volumes:
      - ./compose.yml:/compose.yml:ro
    environment:
      NODE_ID: 1
      TYPE: Host
    networks:
      wg_n1:
        ipv4_address: 172.30.0.3
    entrypoint: sh -c "apk add iproute2 bash curl && tail -f /dev/null"
    image: alpine

  n2:
    container_name: n2
    hostname: n2
    cap_add:
      - NET_ADMIN
    privileged: 'true'
    volumes:
      - ./compose.yml:/compose.yml:ro
    environment:
      NODE_ID: 2
      TYPE: Host
    networks:
      wg_n2:
        ipv4_address: 172.31.0.3
    entrypoint: sh -c "apk add iproute2 bash curl && tail -f /dev/null"
    image: alpine

networks:
  wg_n1:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  wg_n2:
    ipam:
      config:
        - subnet: 172.31.0.0/24
