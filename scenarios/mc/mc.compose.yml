name: 'mc'

services:
  rcc1:
    hostname: rcc1
    container_name: rcc1
    image: alpine
    cap_add:
      - NET_ADMIN
    networks:
      
      rcc1_rcc2:
        ipv4_address: 172.33.1.2

      gs1_rcc1:
        ipv4_address: 172.33.2.3

      r2cc_rcc1:
        ipv4_address: 172.33.3.3

      gs2_rcc1:
        ipv4_address: 172.33.4.3

      r1cc_rcc1:
        ipv4_address: 172.33.5.3

    environment:
      
      - X=222.0
      - Y=101.0
      - TYPE=Host
      - NODE_ID=100
    privileged: true
    entrypoint: sh -c "apk add bash iproute2-tc ;  tail -f /dev/null"


  rcc2:
    hostname: rcc2
    container_name: rcc2
    image: alpine
    cap_add:
      - NET_ADMIN
    networks:
      
      rcc1_rcc2:
