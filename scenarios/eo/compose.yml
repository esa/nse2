# Command: csv_to_compose.py --strip-prefix eo --name earth-orbit --nodes nodes.json --output compose.yml actual_contacts.csv

name: earth-orbit
services:
  gs1:
    container_name: gs1
    hostname: gs1
    cap_add:
    - NET_ADMIN
    privileged: true
    environment:
    - NODE_NAME=Ground Station 1
    - NODE_ID=10
    - TYPE=Host
    networks:
      gs1_mcc:
        ipv4_address: 172.33.0.2
      gs1_pcc:
        ipv4_address: 172.33.1.2
      gs1_sat:
        ipv4_address: 172.33.2.2
    image: alpine
    entrypoint: sh -c "apk add iproute2 bash && tail -f /dev/null"
  mcc:
    container_name: mcc
    hostname: mcc
    cap_add:
    - NET_ADMIN
    privileged: true
    environment:
    - NODE_NAME=Mission Control Centre
    - NODE_ID=30
    - TYPE=Host
    networks:
      gs1_mcc:
        ipv4_address: 172.33.0.3
      gs2_mcc:
        ipv4_address: 172.33.3.3
      mcc_pcc:
        ipv4_address: 172.33.4.2
    image: alpine
    entrypoint: sh -c "apk add iproute2 bash && tail -f /dev/null"
  pcc:
    container_name: pcc
    hostname: pcc
    cap_add:
    - NET_ADMIN
    privileged: true
    environment:
    - NODE_NAME=Payload Control Centre
    - NODE_ID=40
    - TYPE=Host
    networks:
      gs1_pcc:
        ipv4_address: 172.33.1.3
      mcc_pcc:
        ipv4_address: 172.33.4.3
      gs2_pcc:
        ipv4_address: 172.33.5.3
    image: alpine
    entrypoint: sh -c "apk add iproute2 bash && tail -f /dev/null"
  gs2:
    container_name: gs2
    hostname: gs2
    cap_add:
    - NET_ADMIN
    privileged: true
    environment:
    - NODE_NAME=Ground Station 2
    - NODE_ID=20
    - TYPE=Host
    networks:
      gs2_mcc:
        ipv4_address: 172.33.3.2
      gs2_pcc:
        ipv4_address: 172.33.5.2
      gs2_sat:
        ipv4_address: 172.33.6.2
    image: alpine
    entrypoint: sh -c "apk add iproute2 bash && tail -f /dev/null"
  sat:
    container_name: sat
    hostname: sat
    cap_add:
    - NET_ADMIN
    privileged: true
    environment:
    - NODE_NAME=Earth Observation Satellite
    - NODE_ID=50
    - TYPE=Host
    networks:
      gs1_sat:
        ipv4_address: 172.33.2.3
      gs2_sat:
        ipv4_address: 172.33.6.3
    image: alpine
    entrypoint: sh -c "apk add iproute2 bash && tail -f /dev/null"
networks:
  gs1_mcc:
    driver: bridge
    ipam:
      config:
      - subnet: 172.33.0.0/24
    driver_opts:
      com.docker.network.container_iface_prefix: gs1_mcc_
  gs1_pcc:
    driver: bridge
    ipam:
      config:
      - subnet: 172.33.1.0/24
    driver_opts:
      com.docker.network.container_iface_prefix: gs1_pcc_
  gs1_sat:
    driver: bridge
    ipam:
