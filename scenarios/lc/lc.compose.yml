name: 'lc'

services:
  rcc1:
    hostname: rcc1
    container_name: rcc1
    image: alpine
    cap_add:
      - NET_ADMIN
    networks:
      
      gs2_rcc1:
        ipv4_address: 172.33.1.3

      b1cc_rcc1:
        ipv4_address: 172.33.2.3

