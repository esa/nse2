    driver_opts:
      com.docker.network.container_iface_prefix: gs1_sat_
  gs2_mcc:
    driver: bridge
    ipam:
      config:
      - subnet: 172.33.3.0/24
    driver_opts:
      com.docker.network.container_iface_prefix: gs2_mcc_
  mcc_pcc:
    driver: bridge
    ipam:
      config:
      - subnet: 172.33.4.0/24
    driver_opts:
